<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MARLEY">
<meta name="theme-color" content="#060b1a">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<title>MARLEY — AI Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --cyan: #00e5ff;
  --cyan-dim: #00e5ff44;
  --cyan-glow: #00e5ff88;
  --blue: #0066ff;
  --navy: #060b1a;
  --panel: #0a1128cc;
  --panel-border: #00e5ff22;
  --text: #c8e6f0;
  --text-dim: #4a7a8a;
  --danger: #ff3366;
  --success: #00ff88;
  --amber: #ffaa00;
}

html, body {
  height: 100%;
  background: var(--navy);
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── Scanline overlay ─────────────────────────────────── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0, 229, 255, 0.015) 2px,
    rgba(0, 229, 255, 0.015) 4px
  );
  pointer-events: none;
  z-index: 9999;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at 50% 0%, rgba(0, 229, 255, 0.06) 0%, transparent 60%),
              radial-gradient(ellipse at 50% 100%, rgba(0, 102, 255, 0.04) 0%, transparent 50%);
  pointer-events: none;
  z-index: 1;
}

/* ── Grid background ──────────────────────────────────── */
#grid-bg {
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  z-index: 0;
}

/* ── Particles canvas ─────────────────────────────────── */
#particles {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* ── Main layout ──────────────────────────────────────── */
#app {
  position: relative;
  z-index: 10;
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 1400px;
  margin: 0 auto;
  padding: 16px 24px;
}

/* ── Header ───────────────────────────────────────────── */
#header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0 12px;
  border-bottom: 1px solid var(--panel-border);
  flex-shrink: 0;
}

#logo {
  display: flex;
  align-items: center;
  gap: 16px;
}

#logo h1 {
  font-family: 'Orbitron', sans-serif;
  font-weight: 800;
  font-size: 28px;
  letter-spacing: 12px;
  color: var(--cyan);
  text-shadow: 0 0 30px var(--cyan-glow), 0 0 60px rgba(0, 229, 255, 0.2);
  animation: titlePulse 4s ease-in-out infinite;
}

@keyframes titlePulse {
  0%, 100% { text-shadow: 0 0 30px var(--cyan-glow), 0 0 60px rgba(0, 229, 255, 0.2); }
  50% { text-shadow: 0 0 40px var(--cyan-glow), 0 0 80px rgba(0, 229, 255, 0.35), 0 0 120px rgba(0, 229, 255, 0.1); }
}

#logo .subtitle {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  letter-spacing: 4px;
  color: var(--text-dim);
  text-transform: uppercase;
}

#header-right {
  display: flex;
  align-items: center;
  gap: 20px;
}

#status-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--success);
  padding: 6px 16px;
  border: 1px solid rgba(0, 255, 136, 0.2);
  border-radius: 2px;
  background: rgba(0, 255, 136, 0.04);
}

#status-badge .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 8px var(--success);
  animation: dotPulse 2s ease-in-out infinite;
}

#status-badge.thinking { color: var(--amber); border-color: rgba(255, 170, 0, 0.2); background: rgba(255, 170, 0, 0.04); }
#status-badge.thinking .dot { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
#status-badge.searching { color: var(--cyan); border-color: rgba(0, 229, 255, 0.2); background: rgba(0, 229, 255, 0.04); }
#status-badge.searching .dot { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
#status-badge.listening { color: var(--danger); border-color: rgba(255, 51, 102, 0.2); background: rgba(255, 51, 102, 0.04); }
#status-badge.listening .dot { background: var(--danger); box-shadow: 0 0 8px var(--danger); animation: dotPulse 0.6s ease-in-out infinite; }

@keyframes dotPulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.7); }
}

#clock {
  font-family: 'Share Tech Mono', monospace;
  font-size: 12px;
  color: var(--text-dim);
  letter-spacing: 2px;
}

/* ── Center area: ring + chat ─────────────────────────── */
#center {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
  position: relative;
  min-height: 0;
}

/* ── Arc ring ─────────────────────────────────────────── */
#ring-container {
  position: relative;
  width: 220px;
  height: 220px;
  flex-shrink: 0;
  margin: 12px 0;
  cursor: pointer;
}

#ring-container svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.ring-arc {
  fill: none;
  stroke-linecap: round;
}

.arc-outer {
  stroke: var(--cyan);
  stroke-width: 2;
  opacity: 0.6;
  filter: drop-shadow(0 0 6px var(--cyan-glow));
  stroke-dasharray: 180 360;
  animation: rotateArc 12s linear infinite;
  transform-origin: center;
}

.arc-mid {
  stroke: var(--cyan);
  stroke-width: 1.5;
  opacity: 0.35;
  stroke-dasharray: 120 360;
  animation: rotateArc 8s linear infinite reverse;
  transform-origin: center;
}

.arc-inner {
  stroke: var(--blue);
  stroke-width: 1;
  opacity: 0.3;
  stroke-dasharray: 90 360;
  animation: rotateArc 6s linear infinite;
  transform-origin: center;
}

@keyframes rotateArc {
  to { transform: rotate(360deg); }
}

/* Active/thinking state */
#ring-container.active .arc-outer {
  animation-duration: 2s;
  opacity: 1;
  stroke-width: 3;
  filter: drop-shadow(0 0 12px var(--cyan)) drop-shadow(0 0 24px var(--cyan-glow));
}
#ring-container.active .arc-mid {
  animation-duration: 1.5s;
  opacity: 0.7;
  stroke-width: 2;
}
#ring-container.active .arc-inner {
  animation-duration: 1s;
  opacity: 0.6;
  stroke-width: 1.5;
}

/* Listening state — red glow */
#ring-container.listening .arc-outer {
  stroke: var(--danger);
  animation-duration: 3s;
  opacity: 1;
  stroke-width: 3;
  filter: drop-shadow(0 0 12px var(--danger)) drop-shadow(0 0 24px rgba(255, 51, 102, 0.4));
}
#ring-container.listening .arc-mid {
  stroke: var(--danger);
  animation-duration: 2s;
  opacity: 0.6;
  stroke-width: 2;
}
#ring-container.listening .arc-inner {
  stroke: var(--danger);
  animation-duration: 1.5s;
  opacity: 0.4;
  stroke-width: 1.5;
}
#ring-container.listening #ring-core {
  background: radial-gradient(circle, rgba(255, 51, 102, 0.2) 0%, transparent 70%);
  animation: corePulse 1s ease-in-out infinite;
}
#ring-container.listening .core-icon {
  color: var(--danger);
  text-shadow: 0 0 20px rgba(255, 51, 102, 0.6);
}

#ring-core {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0, 229, 255, 0.12) 0%, transparent 70%);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 4px;
}

#ring-core .core-icon {
  font-family: 'Orbitron', sans-serif;
  font-weight: 700;
  font-size: 16px;
  color: var(--cyan);
  letter-spacing: 3px;
  text-shadow: 0 0 20px var(--cyan-glow);
  transition: color 0.3s, text-shadow 0.3s;
}

#ring-container.active #ring-core {
  background: radial-gradient(circle, rgba(0, 229, 255, 0.25) 0%, transparent 70%);
  animation: corePulse 1s ease-in-out infinite;
}

@keyframes corePulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); }
  50% { transform: translate(-50%, -50%) scale(1.1); }
}

/* ── Live transcript ──────────────────────────────────── */
#live-transcript {
  font-family: 'Share Tech Mono', monospace;
  font-size: 13px;
  letter-spacing: 1px;
  color: var(--text-dim);
  min-height: 20px;
  text-align: center;
  padding: 4px 20px;
  max-width: 600px;
  opacity: 0;
  transition: opacity 0.3s;
}

#live-transcript.visible {
  opacity: 1;
  color: var(--danger);
}

/* ── Chat area ────────────────────────────────────────── */
#chat-area {
  flex: 1;
  width: 100%;
  overflow-y: auto;
  padding: 8px 4px;
  min-height: 0;
  scroll-behavior: smooth;
  mask-image: linear-gradient(to bottom, transparent 0%, black 3%, black 97%, transparent 100%);
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 3%, black 97%, transparent 100%);
}

#chat-area::-webkit-scrollbar { width: 4px; }
#chat-area::-webkit-scrollbar-track { background: transparent; }
#chat-area::-webkit-scrollbar-thumb { background: var(--cyan-dim); border-radius: 2px; }

.message {
  display: flex;
  margin-bottom: 16px;
  animation: msgIn 0.3s ease-out;
  max-width: 85%;
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.message.user {
  margin-left: auto;
  flex-direction: row-reverse;
}

.msg-label {
  font-family: 'Orbitron', sans-serif;
  font-size: 9px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 4px;
}

.message.user .msg-label { text-align: right; color: var(--blue); }
.message.marley .msg-label { color: var(--cyan); }

.msg-bubble {
  padding: 12px 18px;
  border-radius: 4px;
  font-size: 15px;
  line-height: 1.65;
  font-weight: 400;
  letter-spacing: 0.3px;
}

.message.user .msg-bubble {
  background: rgba(0, 102, 255, 0.1);
  border: 1px solid rgba(0, 102, 255, 0.2);
  border-right: 3px solid var(--blue);
  color: #d0e4ff;
}

.message.marley .msg-bubble {
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-left: 3px solid var(--cyan);
  color: var(--text);
}

/* Markdown styles */
.msg-bubble p { margin-bottom: 8px; }
.msg-bubble p:last-child { margin-bottom: 0; }
.msg-bubble strong { color: var(--cyan); font-weight: 600; }
.msg-bubble em { font-style: italic; color: #9ac8d8; }
.msg-bubble code {
  font-family: 'Share Tech Mono', monospace;
  background: rgba(0, 229, 255, 0.08);
  border: 1px solid rgba(0, 229, 255, 0.12);
  padding: 2px 6px;
  border-radius: 2px;
  font-size: 13px;
  color: var(--cyan);
}
.msg-bubble pre {
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid var(--panel-border);
  border-radius: 4px;
  padding: 14px 16px;
  margin: 10px 0;
  overflow-x: auto;
  font-family: 'Share Tech Mono', monospace;
  font-size: 13px;
  line-height: 1.5;
  color: var(--cyan);
}
.msg-bubble pre code { background: none; border: none; padding: 0; color: inherit; }
.msg-bubble ul, .msg-bubble ol { padding-left: 20px; margin: 8px 0; }
.msg-bubble li { margin-bottom: 4px; }
.msg-bubble a { color: var(--cyan); text-decoration: underline; text-underline-offset: 2px; }
.msg-bubble h1, .msg-bubble h2, .msg-bubble h3 {
  font-family: 'Orbitron', sans-serif;
  color: var(--cyan);
  margin: 12px 0 6px;
  font-size: 14px;
  letter-spacing: 2px;
}
.msg-bubble blockquote {
  border-left: 2px solid var(--cyan-dim);
  padding-left: 12px;
  margin: 8px 0;
  color: var(--text-dim);
  font-style: italic;
}

/* ── Bottom bar ───────────────────────────────────────── */
#bottom-bar {
  flex-shrink: 0;
  padding: 8px 0 4px;
  border-top: 1px solid var(--panel-border);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

#voice-mode-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  width: 100%;
}

.bar-btn {
  border: 1px solid var(--panel-border);
  border-radius: 3px;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.25s;
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 8px 16px;
}

.bar-btn:hover {
  color: var(--cyan);
  border-color: var(--cyan-dim);
  background: rgba(0, 229, 255, 0.05);
}

.bar-btn svg { width: 14px; height: 14px; }

.bar-btn.active {
  color: var(--success);
  border-color: rgba(0, 255, 136, 0.3);
  background: rgba(0, 255, 136, 0.05);
}

.bar-btn.active.wake-listening {
  color: var(--cyan);
  border-color: var(--cyan-dim);
  background: rgba(0, 229, 255, 0.08);
  animation: subtlePulse 3s ease-in-out infinite;
}

@keyframes subtlePulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0, 229, 255, 0.1); }
  50% { box-shadow: 0 0 12px 2px rgba(0, 229, 255, 0.15); }
}

/* ── Collapsed text input ─────────────────────────────── */
#text-input-row {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transition: max-height 0.3s, opacity 0.3s, margin 0.3s;
}

#text-input-row.visible {
  max-height: 60px;
  opacity: 1;
  margin-top: 4px;
}

#msg-input {
  flex: 1;
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: 4px;
  outline: none;
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  font-size: 16px;
  font-weight: 500;
  letter-spacing: 0.5px;
  padding: 10px 14px;
  transition: border-color 0.3s;
}

#msg-input:focus { border-color: var(--cyan-dim); }
#msg-input::placeholder { color: var(--text-dim); font-weight: 400; }

#send-btn {
  width: 42px;
  height: 42px;
  border: 1px solid var(--panel-border);
  border-radius: 3px;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.25s;
  flex-shrink: 0;
}

#send-btn:hover {
  color: #fff;
  background: rgba(0, 229, 255, 0.15);
  border-color: var(--cyan);
  box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
}

#send-btn svg { width: 18px; height: 18px; }

/* ── Footer info ──────────────────────────────────────── */
#footer-info {
  display: flex;
  justify-content: space-between;
  width: 100%;
  padding: 2px 4px 0;
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--text-dim);
  opacity: 0.5;
}

/* ── Welcome screen ───────────────────────────────────── */
#welcome {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px;
  text-align: center;
  opacity: 1;
  transition: opacity 0.5s;
}

#welcome.hidden { display: none; }

#welcome h2 {
  font-family: 'Orbitron', sans-serif;
  font-size: 16px;
  font-weight: 500;
  letter-spacing: 8px;
  color: var(--cyan);
  margin-bottom: 12px;
  text-shadow: 0 0 20px var(--cyan-glow);
}

#welcome p {
  color: var(--text-dim);
  font-size: 14px;
  line-height: 1.8;
  max-width: 500px;
  letter-spacing: 0.5px;
}

#welcome .wake-hint {
  margin-top: 20px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 12px;
  letter-spacing: 3px;
  color: var(--cyan);
  opacity: 0.6;
}

/* ── Responsive ───────────────────────────────────────── */
@media (max-width: 768px) {
  #app { padding: 10px 14px; }
  #logo h1 { font-size: 20px; letter-spacing: 8px; }
  #ring-container { width: 160px; height: 160px; margin: 8px 0; }
  .message { max-width: 95%; }
  #header-right { gap: 10px; }
  #clock { display: none; }
}

@media (max-width: 480px) {
  #logo h1 { font-size: 16px; letter-spacing: 6px; }
  #logo .subtitle { display: none; }
  #ring-container { width: 120px; height: 120px; }
  #status-badge { font-size: 9px; padding: 4px 10px; }
}
</style>
</head>
<body>

<div id="grid-bg"></div>
<canvas id="particles"></canvas>

<div id="app">
  <!-- Header -->
  <div id="header">
    <div id="logo">
      <div>
        <h1>MARLEY</h1>
        <div class="subtitle">Advanced Intelligence System</div>
      </div>
    </div>
    <div id="header-right">
      <div id="status-badge">
        <span class="dot"></span>
        <span id="status-text">ONLINE</span>
      </div>
      <div id="clock"></div>
    </div>
  </div>

  <!-- Center -->
  <div id="center">
    <!-- Arc Ring (tap to activate voice) -->
    <div id="ring-container" onclick="handleRingTap()">
      <svg viewBox="0 0 200 200">
        <circle class="ring-arc arc-outer" cx="100" cy="100" r="90" />
        <circle class="ring-arc arc-mid" cx="100" cy="100" r="75" />
        <circle class="ring-arc arc-inner" cx="100" cy="100" r="60" />
      </svg>
      <div id="ring-core">
        <span class="core-icon">M</span>
      </div>
    </div>

    <!-- Live speech transcript -->
    <div id="live-transcript"></div>

    <!-- Welcome -->
    <div id="welcome">
      <h2>SYSTEMS ONLINE</h2>
      <p>Hello. I'm MARLEY, your personal AI assistant.<br>
         I have full access to your systems and the internet.</p>
      <div class="wake-hint">SAY "MARLEY" OR TAP THE RING TO BEGIN</div>
    </div>

    <!-- Chat -->
    <div id="chat-area"></div>
  </div>

  <!-- Bottom bar -->
  <div id="bottom-bar">
    <div id="voice-mode-bar">
      <button class="bar-btn" id="wake-btn" onclick="toggleWakeWord()" title="Always listening for wake word">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
        WAKE WORD
      </button>
      <button class="bar-btn" id="vox-btn" onclick="toggleVoice()" title="Toggle voice responses">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        </svg>
        VOX
      </button>
      <button class="bar-btn" id="type-btn" onclick="toggleTextInput()" title="Show text input">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 7 4 4 20 4 20 7"/>
          <line x1="9" y1="20" x2="15" y2="20"/>
          <line x1="12" y1="4" x2="12" y2="20"/>
        </svg>
        TYPE
      </button>
    </div>

    <!-- Collapsible text input -->
    <div id="text-input-row">
      <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off" />
      <button id="send-btn" title="Send" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>

    <div id="footer-info">
      <span>CLAUDE SONNET // FULL SYSTEM ACCESS</span>
      <span id="session-id"></span>
    </div>
  </div>
</div>

<script>
// ── State ───────────────────────────────────────────────
let ws = null;
let voiceEnabled = true;
let currentBubble = null;
let currentRawText = '';
let chatStarted = false;
let isSpeaking = false;

// Wake word & conversation state
let wakeWordActive = false;
let wakeRecognition = null;
let isWakeListening = false;
let isCapturing = false;
let marleyIsProcessing = false;
let activeCapture = null; // reference to current speech recognition instance

// Conversation mode: after wake word triggers, stay in continuous
// conversation until 45s of silence
let inConversation = false;
let conversationTimeout = null;
const CONVERSATION_TIMEOUT_MS = 45000; // 45 seconds idle → back to wake word

function resetConversationTimer() {
  clearTimeout(conversationTimeout);
  conversationTimeout = setTimeout(() => {
    // Conversation timed out — exit conversation mode
    inConversation = false;
    if (wakeWordActive && !marleyIsProcessing) {
      startWakeWordListening();
      setStatus('online', 'AWAITING COMMAND');
    } else if (!wakeWordActive) {
      setStatus('online', 'ONLINE');
    }
  }, CONVERSATION_TIMEOUT_MS);
}

function enterConversation() {
  inConversation = true;
  resetConversationTimer();
}

function exitConversation() {
  inConversation = false;
  clearTimeout(conversationTimeout);
}

// ── WebSocket ───────────────────────────────────────────
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);

  ws.onopen = () => {
    setStatus('online', 'ONLINE');
    document.getElementById('session-id').textContent =
      'SESSION ' + Math.random().toString(36).substring(2, 8).toUpperCase();
  };

  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    handleMessage(data);
  };

  ws.onclose = () => {
    setStatus('offline', 'RECONNECTING...');
    setTimeout(connect, 3000);
  };

  ws.onerror = () => ws.close();
}

function handleMessage(data) {
  switch (data.type) {
    case 'thinking':
      setStatus('thinking', 'THINKING');
      setRingState('active');
      break;

    case 'searching':
      setStatus('searching', data.query || 'SEARCHING WEB');
      break;

    case 'delta':
      if (!currentBubble) {
        currentBubble = addMessage('marley', '');
        currentRawText = '';
      }
      currentRawText += data.text;
      currentBubble.innerHTML = renderMarkdown(currentRawText);
      scrollChat();
      break;

    case 'session_saved':
      setStatus('online', 'SESSION SAVED');
      exitConversation();
      break;

    case 'done':
      marleyIsProcessing = false;

      if (currentRawText && voiceEnabled) {
        speak(currentRawText, () => {
          onResponseComplete();
        });
        // Start listening immediately while she speaks — user can interrupt
        if (inConversation) {
          setTimeout(() => startConversationCapture(), 300);
        }
      } else {
        onResponseComplete();
      }
      currentBubble = null;
      currentRawText = '';
      setStatus('online', inConversation ? 'LISTENING' : 'ONLINE');
      setRingState('idle');
      break;

    case 'error':
      addMessage('marley', `Error: ${data.text}`);
      setStatus('online', 'ONLINE');
      setRingState('idle');
      currentBubble = null;
      currentRawText = '';
      marleyIsProcessing = false;
      onResponseComplete();
      break;
  }
}

function onResponseComplete() {
  if (inConversation) {
    // Stay in conversation mode — immediately start listening again
    resetConversationTimer();
    setTimeout(() => startConversationCapture(), 300);
  } else if (wakeWordActive) {
    startWakeWordListening();
  }
}

// ── Chat ────────────────────────────────────────────────
function addMessage(role, text) {
  if (!chatStarted) {
    chatStarted = true;
    document.getElementById('welcome').classList.add('hidden');
  }

  const chat = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = `message ${role}`;

  const label = role === 'user' ? 'YOU' : 'MARLEY';
  div.innerHTML = `
    <div>
      <div class="msg-label">${label}</div>
      <div class="msg-bubble">${role === 'user' ? escapeHtml(text) : renderMarkdown(text)}</div>
    </div>
  `;

  chat.appendChild(div);
  scrollChat();
  return div.querySelector('.msg-bubble');
}

function sendText(text) {
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  // Interrupt Marley if speaking
  if (isSpeaking) {
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    speechSynthesis.cancel();
    isSpeaking = false;
  }
  addMessage('user', text);
  ws.send(JSON.stringify({ message: text }));
  marleyIsProcessing = true;
  // Any time user speaks, we're in a conversation
  enterConversation();
}

function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;
  sendText(text);
  input.value = '';
  input.focus();
}

function scrollChat() {
  const chat = document.getElementById('chat-area');
  chat.scrollTop = chat.scrollHeight;
}

// ── Ring tap ────────────────────────────────────────────
function handleRingTap() {
  if (marleyIsProcessing) return;

  // If speaking, interrupt
  if (isSpeaking) {
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    speechSynthesis.cancel();
    isSpeaking = false;
  }

  // If already listening, stop everything
  if (inConversation || activeCapture) {
    stopConversationCapture();
    exitConversation();
    setRingState('idle');
    setStatus('online', wakeWordActive ? 'AWAITING COMMAND' : 'ONLINE');
    if (wakeWordActive) startWakeWordListening();
    return;
  }

  stopWakeWordListening();
  enterConversation();
  startConversationCapture();
}

function stopConversationCapture() {
  if (activeCapture) {
    try { activeCapture.abort(); } catch(e) {}
    activeCapture = null;
  }
  isCapturing = false;
  document.getElementById('live-transcript').classList.remove('visible');
}

// ── Conversation capture (no wake word needed) ──────────
function startConversationCapture() {
  if (!hasSpeechRecognition()) return;
  if (activeCapture) return; // already listening, don't stack

  stopWakeWordListening();

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR();
  rec.continuous = true;
  rec.interimResults = true;
  rec.lang = 'en-US';

  activeCapture = rec;

  const transcript = document.getElementById('live-transcript');
  let finalText = '';
  let silenceTimer = null;

  // After user stops talking, wait 2s of silence then send
  function resetSilenceTimer() {
    clearTimeout(silenceTimer);
    silenceTimer = setTimeout(() => {
      if (finalText) {
        rec.stop();
      }
    }, 2000);
  }

  rec.onstart = () => {
    setStatus('listening', 'LISTENING');
    setRingState('listening');
    transcript.classList.add('visible');
    transcript.textContent = '...';
  };

  rec.onresult = (e) => {
    let interim = '';
    let final_ = '';
    for (let i = 0; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        final_ += e.results[i][0].transcript;
      } else {
        interim += e.results[i][0].transcript;
      }
    }
    transcript.textContent = final_ + interim || '...';
    if (final_) {
      finalText = final_.trim();
      resetSilenceTimer();
    }
  };

  rec.onend = () => {
    clearTimeout(silenceTimer);
    activeCapture = null;
    transcript.classList.remove('visible');
    isCapturing = false;

    if (finalText) {
      setRingState('idle');
      sendText(finalText);
    } else if (inConversation && !marleyIsProcessing) {
      // No speech — quietly restart without flickering
      setTimeout(() => startConversationCapture(), 500);
    } else if (wakeWordActive) {
      setRingState('idle');
      startWakeWordListening();
    } else {
      setRingState('idle');
      setStatus('online', 'ONLINE');
    }
  };

  rec.onerror = (e) => {
    clearTimeout(silenceTimer);

    if (e.error === 'no-speech') {
      // Don't flicker — just let onend handle the restart
      return;
    }

    if (e.error === 'not-allowed') {
      activeCapture = null;
      transcript.classList.remove('visible');
      exitConversation();
      wakeWordActive = false;
      document.getElementById('wake-btn').classList.remove('active', 'wake-listening');
      alert('Microphone access denied. Please allow microphone access and try again.');
      return;
    }

    // aborted is fine (user stopped it)
    if (e.error === 'aborted') return;
  };

  rec.start();
}

// ── Wake word system ────────────────────────────────────
function hasSpeechRecognition() {
  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) return true;
  alert('Speech recognition not supported. Use Chrome or Edge.');
  return false;
}

function toggleWakeWord() {
  if (!hasSpeechRecognition()) return;

  wakeWordActive = !wakeWordActive;
  const btn = document.getElementById('wake-btn');

  if (wakeWordActive) {
    btn.classList.add('active', 'wake-listening');
    if (!inConversation) startWakeWordListening();
  } else {
    btn.classList.remove('active', 'wake-listening');
    exitConversation();
    stopWakeWordListening();
    setStatus('online', 'ONLINE');
  }
}

function startWakeWordListening() {
  if (isWakeListening || marleyIsProcessing || inConversation) return;

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  wakeRecognition = new SR();
  wakeRecognition.continuous = true;
  wakeRecognition.interimResults = true;
  wakeRecognition.lang = 'en-US';

  wakeRecognition.onstart = () => {
    isWakeListening = true;
    if (!marleyIsProcessing) {
      setStatus('online', 'AWAITING COMMAND');
      setRingState('idle');
    }
  };

  wakeRecognition.onresult = (e) => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const text = e.results[i][0].transcript.toLowerCase().trim();

      if (!isCapturing && containsWakeWord(text)) {
        isCapturing = true;
        playActivationChime();
        stopWakeWordListening();

        // Extract anything said after "marley"
        const afterWake = extractAfterWakeWord(e.results[i][0].transcript);

        if (e.results[i].isFinal && afterWake.trim().length > 3) {
          // Full command in one breath: "Marley how's the trader"
          isCapturing = false;
          sendText(afterWake.trim());
        } else {
          // Just said "Marley" — start conversation capture
          isCapturing = false;
          enterConversation();
          setTimeout(() => startConversationCapture(), 200);
        }
        return;
      }
    }
  };

  wakeRecognition.onend = () => {
    isWakeListening = false;
    if (wakeWordActive && !isCapturing && !marleyIsProcessing && !inConversation) {
      setTimeout(() => startWakeWordListening(), 300);
    }
  };

  wakeRecognition.onerror = (e) => {
    isWakeListening = false;
    if (e.error === 'not-allowed') {
      wakeWordActive = false;
      document.getElementById('wake-btn').classList.remove('active', 'wake-listening');
      alert('Microphone access denied. Please allow microphone access and try again.');
      return;
    }
    if (wakeWordActive && !isCapturing && !marleyIsProcessing && !inConversation) {
      setTimeout(() => startWakeWordListening(), 1000);
    }
  };

  wakeRecognition.start();
}

function stopWakeWordListening() {
  if (wakeRecognition) {
    isWakeListening = false;
    try { wakeRecognition.stop(); } catch(e) {}
    wakeRecognition = null;
  }
}

function containsWakeWord(text) {
  return /\bmarley\b/i.test(text);
}

function extractAfterWakeWord(text) {
  const match = text.match(/\bmarley[,]?\s*(.*)/i);
  return match ? match[1] : '';
}

// ── Activation chime ────────────────────────────────────
function playActivationChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, ctx.currentTime);
    osc.frequency.setValueAtTime(900, ctx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.25);
  } catch(e) {}
}

// ── Ring state management ───────────────────────────────
function setRingState(state) {
  const ring = document.getElementById('ring-container');
  ring.classList.remove('active', 'listening');
  if (state === 'active') ring.classList.add('active');
  if (state === 'listening') ring.classList.add('listening');
}

// ── Voice output ────────────────────────────────────────
function toggleVoice() {
  voiceEnabled = !voiceEnabled;
  const btn = document.getElementById('vox-btn');
  btn.classList.toggle('active', voiceEnabled);
}

let currentAudio = null;

function speak(text, onDone) {
  // Stop any current playback
  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
  }
  speechSynthesis.cancel();

  isSpeaking = true;

  fetch('/api/tts', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text }),
  })
  .then(resp => {
    if (!resp.ok) throw new Error('TTS failed');
    return resp.blob();
  })
  .then(blob => {
    // Check if we were interrupted while waiting
    if (!isSpeaking) {
      if (onDone) onDone();
      return;
    }
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    currentAudio = audio;
    audio.onended = () => {
      isSpeaking = false;
      currentAudio = null;
      URL.revokeObjectURL(url);
      if (onDone) onDone();
    };
    audio.onerror = () => {
      isSpeaking = false;
      currentAudio = null;
      URL.revokeObjectURL(url);
      if (onDone) onDone();
    };
    audio.play();
  })
  .catch(() => {
    // Fallback to browser TTS if ElevenLabs fails
    isSpeaking = false;
    if (onDone) onDone();
  });
}

// ── Text input toggle ───────────────────────────────────
function toggleTextInput() {
  const row = document.getElementById('text-input-row');
  const btn = document.getElementById('type-btn');
  const isVisible = row.classList.contains('visible');
  row.classList.toggle('visible');
  btn.classList.toggle('active');
  if (!isVisible) {
    document.getElementById('msg-input').focus();
  }
}

// ── Status ──────────────────────────────────────────────
function setStatus(cls, text) {
  const badge = document.getElementById('status-badge');
  badge.className = cls;
  document.getElementById('status-text').textContent = text;
}

// ── Markdown renderer ───────────────────────────────────
function renderMarkdown(text) {
  let html = escapeHtml(text);
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) =>
    `<pre><code>${code.trim()}</code></pre>`
  );
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  html = html.replace(/^[\-\*] (.+)$/gm, '<li>$1</li>');
  html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  html = html.replace(/\n\n/g, '</p><p>');
  html = html.replace(/\n/g, '<br>');
  if (!html.startsWith('<')) html = '<p>' + html + '</p>';
  return html;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ── Clock ───────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  const s = String(now.getSeconds()).padStart(2, '0');
  document.getElementById('clock').textContent = `${h}:${m}:${s}`;
}
setInterval(updateClock, 1000);
updateClock();

// ── Particles ───────────────────────────────────────────
(function initParticles() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let w, h;
  const particles = [];
  const COUNT = 60;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }

  window.addEventListener('resize', resize);
  resize();

  for (let i = 0; i < COUNT; i++) {
    particles.push({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      size: Math.random() * 2 + 0.5,
      alpha: Math.random() * 0.3 + 0.05,
    });
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);

    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;

      if (p.x < 0) p.x = w;
      if (p.x > w) p.x = 0;
      if (p.y < 0) p.y = h;
      if (p.y > h) p.y = 0;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0, 229, 255, ${p.alpha})`;
      ctx.fill();
    }

    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 120) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(0, 229, 255, ${0.06 * (1 - dist / 120)})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }

    requestAnimationFrame(draw);
  }

  draw();
})();

// ── Key bindings ────────────────────────────────────────
document.getElementById('msg-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// ── Init ────────────────────────────────────────────────
document.getElementById('vox-btn').classList.add('active');
connect();

// ── PWA service worker ─────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/static/sw.js').catch(() => {});
}
</script>
